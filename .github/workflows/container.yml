name: Container

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  IMAGE_NAME: ghcr.io/rareskey/trellis.cpp

jobs:
  cuda:
    name: CUDA SM75 · linux/amd64
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "version tags must use vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi
          if [[ "$tag" == *-* ]]; then
            prerelease="${tag#*-}"
            IFS='.' read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                echo "numeric prerelease identifiers must not contain leading zeroes" >&2
                exit 1
              fi
            done
          fi

      - name: Resolve publication policy
        id: publish
        shell: bash
        env:
          SHOULD_PUSH: >-
            ${{ github.event_name != 'pull_request' &&
                (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        run: echo "push=$SHOULD_PUSH" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: steps.publish.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=trellis.cpp CUDA SM75
            org.opencontainers.image.description=CUDA SM75/Turing TRELLIS.2 C++ runtime; model weights are not included
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and optionally publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          pull: true
          push: ${{ steps.publish.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CMAKE_CUDA_ARCHITECTURES=75
            BUILD_JOBS=4
          cache-from: type=gha,scope=trellis-cuda-sm75
          cache-to: type=gha,mode=max,scope=trellis-cuda-sm75
          provenance: ${{ steps.publish.outputs.push == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ steps.publish.outputs.push == 'true' }}
