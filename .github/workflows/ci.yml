name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build

      - name: Configure CPU build
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_OPENMP=OFF
          -DTRELLIS_WEBP=OFF

      - name: Build public entry points
        run: >
          cmake --build build
          --target trellis-cli trellis-server post-replay
          --parallel 2

      - name: Smoke-test argument parsing
        run: |
          ./build/trellis-cli --help
          ./build/trellis-server --help
