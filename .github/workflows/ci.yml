name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed-file whitespace
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PR_BASE"
          if [[ -z "$base" ]]; then
            base="$PUSH_BASE"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi
          git diff --check "$base" "$GITHUB_SHA"

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z '*.sh')

      - name: Check third-party notice coverage
        shell: bash
        run: |
          set -euo pipefail
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md
          test -s thirdparty/cpp-httplib/LICENSE
          test -s thirdparty/nvidia-cuda-runtime/README.md

          for section in \
            'Microsoft TRELLIS.2' \
            'CuMesh-derived post-processing code' \
            'xatlas' \
            'meshoptimizer v0.24' \
            'Fast Quadric Mesh Simplification (FQMS)' \
            'stb' \
            'cpp-httplib v0.18.7' \
            'ggml (trellis-patches branch)' \
            'libwebp v1.5.0' \
            'OpenCV-derived Telea inpainting' \
            'NVIDIA CUDA runtime redistributables' \
            'Model weights and converted model files'
          do
            grep -Fq "## $section" THIRD_PARTY_NOTICES.md
          done

          for source in \
            include/remesh_dc.h include/uv_bake.h \
            src/decimate_qem.cpp src/decimate_qem.cu src/decimate_qem_vk.cpp \
            src/decimate_qem.comp src/remesh_dc.cpp src/uv_bake.cpp
          do
            grep -Fq 'CuMesh' "$source"
          done
          grep -Fq 'OpenCV' src/uv_bake.cpp

          python3 - <<'PY'
          import json
          from pathlib import Path
          config_path = Path("app/src-tauri/tauri.conf.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          resources = config.get("bundle", {}).get("resources", {})
          expected = {
              "../../LICENSE": "LICENSE",
              "../../THIRD_PARTY_NOTICES.md": "THIRD_PARTY_NOTICES.md",
          }
          for source, target in expected.items():
              assert resources.get(source) == target, (
                  f"missing Tauri resource mapping: {source} -> {target}"
              )
              source_path = (config_path.parent / source).resolve()
              assert source_path == Path(target).resolve()
              assert source_path.is_file() and source_path.stat().st_size
          PY

          release=.github/workflows/release.yml
          grep -Fq "cuda: '13.1.0'" "$release"
          grep -Fq 'cp LICENSE THIRD_PARTY_NOTICES.md dist/' "$release"
          grep -Fq 'NVIDIA-CUDA-LICENSES' "$release"
          grep -Fq 'cuda_cudart/LICENSE.txt' "$release"
          grep -Fq 'libcublas/LICENSE.txt' "$release"
          grep -Fq "find dist -maxdepth 1 -type f" "$release"
          ! grep -Fq "find dist -type f" "$release"
          grep -Fq 'Verify notices in Linux bundles' "$release"
          grep -Fq 'Verify notices in NSIS installer' "$release"
          studio_line="$(grep -n '^  studio:' "$release" | cut -d: -f1)"
          linux_verify_line="$(grep -n 'Verify notices in Linux bundles' "$release" | cut -d: -f1)"
          nsis_verify_line="$(grep -n 'Verify notices in NSIS installer' "$release" | cut -d: -f1)"
          test "$linux_verify_line" -gt "$studio_line"
          test "$nsis_verify_line" -gt "$studio_line"
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' "$release"

      - name: Verify pinned CUDA license inputs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/LICENSE.txt \
            --output /tmp/cuda-cudart-LICENSE.txt
          curl --fail --silent --show-error --location --retry 3 \
            https://developer.download.nvidia.com/compute/cuda/redist/libcublas/LICENSE.txt \
            --output /tmp/libcublas-LICENSE.txt
          expected=e2c71babfd18a8e69542dd7e9ca018f9caa438094001a58e6bc4d8c999bf0d07
          echo "$expected  /tmp/cuda-cudart-LICENSE.txt" | sha256sum --check -
          echo "$expected  /tmp/libcublas-LICENSE.txt" | sha256sum --check -

      - name: Test GLB topology diagnostics
        run: >
          python3 -m unittest discover
          -s tests
          -p 'test_glb_topology.py'
          -v

  cpu-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build

      - name: Configure CPU build
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_OPENMP=OFF
          -DGGML_NATIVE=OFF
          -DTRELLIS_WEBP=OFF

      - name: Build public entry points
        run: >
          cmake --build build
          --target trellis-cli trellis-server post-replay trellis-test-args
          --parallel 2

      - name: Smoke-test argument parsing
        run: |
          ./build/trellis-cli --help
          ./build/trellis-server --help
          ./build/post-replay --help
          ctest --test-dir build --output-on-failure -R trellis-args
          set +e
          ./build/post-replay ignored.bin ignored.glb --webp invalid
          status=$?
          set -e
          test "$status" -eq 2
          set +e
          ./build/post-replay ignored.bin ignored.glb --meshopt --decim 0
          status=$?
          set -e
          test "$status" -eq 2
